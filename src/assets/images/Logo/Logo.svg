<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 100 100">
  <!-- Fondo transparente -->
  <rect width="100" height="100" fill="none"></rect>
  
  <!-- Corazón geométrico -->
  <path d="M50 70 
           C45 65, 35 60, 40 45 
           C45 30, 55 30, 60 45 
           C65 60, 55 65, 50 70 Z" fill="#32CD32"></path>
  
  <!-- Cruz médica simple -->
  <rect x="45" y="35" width="10" height="20" fill="#4682B4" rx="2"></rect>
  <rect x="40" y="40" width="20" height="10" fill="#4682B4" rx="2"></rect>
  
  <!-- Nombre de la clínica -->
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="10" fill="#2E8B57" text-anchor="middle">
    Sistema Clínica
  </text>
</svg>